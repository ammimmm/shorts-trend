<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쇼츠 스튜디오 직원 관리</title>
<style>
:root {
  --bg: #f5f5f2; --surface: #ffffff; --text: #1b1b1a; --muted: #6b6b66; --line: #e3e3de; --chip: #efefea;
  --accent: #d93025; --accent-soft: #fde8e6; --good: #137333; --good-soft: #e6f4ea;
  --warn: #a35a00; --warn-soft: #fdf1dc; --blue: #1a63c9; --blue-soft: #e7effb;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121212; --surface: #1c1c1c; --text: #ececea; --muted: #9b9b96; --line: #2e2e2c; --chip: #2a2a28;
    --accent: #ff6b5e; --accent-soft: #3a1f1c; --good: #6fcf8a; --good-soft: #1b2e21;
    --warn: #f0b45a; --warn-soft: #33281a; --blue: #7fb0ff; --blue-soft: #1c2738;
  }
}
:root[data-theme="dark"] {
  --bg: #121212; --surface: #1c1c1c; --text: #ececea; --muted: #9b9b96; --line: #2e2e2c; --chip: #2a2a28;
  --accent: #ff6b5e; --accent-soft: #3a1f1c; --good: #6fcf8a; --good-soft: #1b2e21;
  --warn: #f0b45a; --warn-soft: #33281a; --blue: #7fb0ff; --blue-soft: #1c2738;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Segoe UI", sans-serif; }
a { color: inherit; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 20px 16px 60px; }
header { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; justify-content: space-between; margin-bottom: 18px; }
h1 { font-size: 22px; margin: 0; letter-spacing: -0.02em; }
h1 small { font-size: 14px; color: var(--muted); font-weight: 500; margin-left: 6px; }
h2 { font-size: 17px; margin: 28px 0 12px; }
.muted { color: var(--muted); font-size: 13px; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.kpi b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.kpi span { color: var(--muted); font-size: 12px; }
.staff-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
.staff { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.staff.hiring { border-style: dashed; background: transparent; }
.who { display: flex; gap: 12px; align-items: center; }
.avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; font-size: 24px; flex: none; }
.who b { font-size: 17px; }
.who .role { color: var(--muted); font-size: 13px; }
.pill { margin-left: auto; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.pill.ok { background: var(--good-soft); color: var(--good); }
.pill.late { background: var(--warn-soft); color: var(--warn); }
.pill.err { background: var(--accent-soft); color: var(--accent); }
.pill.off { background: var(--chip); color: var(--muted); }
.duty { font-size: 13px; color: var(--muted); margin: 0; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.fact { background: var(--chip); border-radius: 8px; padding: 7px 10px; }
.fact small { display: block; color: var(--muted); font-size: 11px; }
.fact b { font-size: 14px; }
.msg { font-size: 13px; padding: 8px 10px; border-radius: 8px; background: var(--blue-soft); color: var(--blue); }
.msg.err { background: var(--accent-soft); color: var(--accent); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 4px; font: inherit; font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text); text-decoration: none; cursor: pointer; }
.btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
.back { display: inline-block; margin-bottom: 10px; color: var(--muted); text-decoration: none; font-size: 14px; }
.profile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
.log { width: 100%; border-collapse: collapse; font-size: 13px; }
.log th, .log td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.log td.wrap-cell { white-space: normal; color: var(--muted); }
.log-box { overflow-x: auto; }
.tabs { display: flex; gap: 4px; margin: 18px 0 12px; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; padding: 10px 14px; font: inherit; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab.on { color: var(--text); border-color: var(--accent); font-weight: 600; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
select, input[type=search] { font: inherit; font-size: 14px; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
input[type=search] { flex: 1 1 180px; }
label.check { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
.thumb { position: relative; display: block; aspect-ratio: 4 / 3; background: #000; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.badge { position: absolute; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; color: #fff; background: rgba(0,0,0,.72); }
.badge.tl { top: 8px; left: 8px; } .badge.tr { top: 8px; right: 8px; background: var(--accent); } .badge.br { bottom: 8px; right: 8px; font-weight: 500; } .badge.bl { bottom: 8px; left: 8px; background: #1a63c9; }
.body { padding: 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.title { font-weight: 600; font-size: 14px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.title a { text-decoration: none; }
.sub { color: var(--muted); font-size: 12px; }
.note { font-size: 13px; line-height: 1.45; }
.note b { color: var(--muted); font-weight: 600; font-size: 12px; margin-right: 4px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.stat { background: var(--chip); border-radius: 8px; padding: 6px 8px; }
.stat b { display: block; font-size: 14px; font-variant-numeric: tabular-nums; }
.stat small { color: var(--muted); font-size: 11px; }
.stat.hot { background: var(--accent-soft); } .stat.hot b { color: var(--accent); }
.stat.buy { background: var(--good-soft); } .stat.buy b { color: var(--good); }
.stat.rep { background: var(--warn-soft); } .stat.rep b { color: var(--warn); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chips span { font-size: 11px; background: var(--chip); color: var(--muted); padding: 2px 7px; border-radius: 999px; }
.chips span.prod { background: var(--blue-soft); color: var(--blue); font-weight: 600; }
details { font-size: 12px; color: var(--muted); }
details summary { cursor: pointer; color: var(--good); }
details p { margin: 6px 0 0; padding: 6px 8px; background: var(--chip); border-radius: 6px; }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.pcard h3 { margin: 0; font-size: 16px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.new { font-size: 11px; background: var(--accent); color: #fff; padding: 1px 6px; border-radius: 4px; }
.pthumb { position: relative; display: block; aspect-ratio: 16 / 10; background: var(--chip); border-radius: 8px; overflow: hidden; }
.pthumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pthumb.contain img { object-fit: contain; background: #fff; }
.idea { background: var(--chip); border-radius: 8px; padding: 8px 10px; font-size: 13px; display: grid; gap: 4px; }
.shop { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: auto; }
.shop a, .shop button { text-align: center; font: inherit; font-size: 12px; font-weight: 600; padding: 7px 0; border-radius: 8px; text-decoration: none; background: var(--chip); border: 0; color: var(--text); cursor: pointer; }
.shop a.main { grid-column: 1 / -1; background: var(--text); color: var(--bg); }
.shop button.on { background: var(--warn-soft); color: var(--warn); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
.toolbar .spacer { flex: 1; }
.more { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 18px 0; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); z-index: 20; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.working { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: 13px; margin: 12px 0; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 16px; z-index: 10; }
.sheet { background: var(--surface); border-radius: 14px; padding: 18px; width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; display: grid; gap: 12px; }
.sheet h3 { margin: 0; font-size: 17px; }
.sheet ol { margin: 0; padding-left: 20px; font-size: 14px; display: grid; gap: 4px; }
.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.field input, .field textarea { font: inherit; font-size: 14px; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.field textarea { min-height: 70px; resize: vertical; }
.bm { display: inline-block; padding: 8px 14px; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 700; text-decoration: none; cursor: grab; }
code { background: var(--chip); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 32px 20px; text-align: center; color: var(--muted); grid-column: 1 / -1; }
.help { margin-top: 28px; font-size: 13px; color: var(--muted); }
.help summary { cursor: pointer; }
@media (max-width: 640px) {
  .kpis { grid-template-columns: 1fr 1fr; }
  .staff-grid { grid-template-columns: 1fr; }
  .grid { grid-template-columns: 1fr 1fr; gap: 8px; }
  .stats { grid-template-columns: 1fr 1fr; } .stat:nth-child(n+5) { display: none; }
  .body { padding: 8px; }
  .shop { grid-template-columns: 1fr 1fr 1fr; }
}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">불러오는 중…</p></div>

<script>
const app = document.getElementById("app");
const S = { cfg: null, cache: {} };

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = (u) => /^https:\/\//.test(u || "") ? esc(u) : "#";
function fmt(n) {
  n = Number(n) || 0;
  if (n >= 1e8) return (n / 1e8).toFixed(1).replace(/\.0$/, "") + "억";
  if (n >= 1e4) return (n / 1e4).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/, "") + "만";
  return n.toLocaleString("ko-KR");
}
const kst = (iso, opt) => new Date(iso).toLocaleString("ko-KR", { timeZone: "Asia/Seoul", ...(opt || { month: "numeric", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit" }) });
const ago = (iso) => {
  const h = (Date.now() - new Date(iso)) / 36e5;
  return h < 1 ? `${Math.max(1, Math.round(h * 60))}분 전` : h < 48 ? `${Math.round(h)}시간 전` : `${Math.round(h / 24)}일 전`;
};
const kstDay = (d) => new Date(d).toLocaleDateString("ko-KR", { timeZone: "Asia/Seoul" });
const thumb = (id) => `https://i.ytimg.com/vi/${encodeURIComponent(id)}/hqdefault.jpg`;
const shortUrl = (id) => `https://www.youtube.com/shorts/${encodeURIComponent(id)}`;

async function getJSON(path, fallback) {
  if (S.cache[path]) return S.cache[path];
  try {
    const res = await fetch(`${path}?t=${Date.now()}`, { cache: "no-store" });
    if (!res.ok) return fallback;
    return (S.cache[path] = await res.json());
  } catch { return fallback; }
}

function nextShift(st) {
  const now = new Date();
  for (let d = 0; d < 2; d++) for (const h of st.hours_utc) {
    const t = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + d, h, st.minute));
    if (t > now) return t;
  }
}
function interval(st) { return (24 / st.hours_utc.length) * 36e5; }

function state(st, status) {
  if (!status) return ["off", "출근 전"];
  if (!status.ok) return ["err", "오류"];
  if (Date.now() - new Date(status.time) > interval(st) * 2.5) return ["late", "근무 지연"];
  return ["ok", "정상 근무"];
}

const workflowUrl = (st) => `https://github.com/${S.cfg.repo}/actions/workflows/${st.workflow}`;

// ---------------- GitHub 연결 (토큰은 이 기기 브라우저에만 저장) ----------------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const token = () => store.get("gh-token", "");

async function gh(path, method = "GET", body) {
  const res = await fetch(`https://api.github.com${path}`, {
    method, body: body ? JSON.stringify(body) : undefined,
    headers: { Authorization: `Bearer ${token()}`, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28",
      ...(body ? { "Content-Type": "application/json" } : {}) },
  });
  if (!res.ok) throw new Error(`GitHub ${res.status}: ${(await res.text()).slice(0, 160)}`);
  return res.status === 204 ? null : res.json();
}
function b64(text) {
  const bytes = new TextEncoder().encode(text);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

function toast(msg, ms = 4000) {
  document.querySelector(".toast")?.remove();
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), ms);
}

// 직원에게 일 시키기: 토큰이 있으면 바로 실행, 없으면 GitHub 화면으로
async function runStaff(st, inputs) {
  if (!token()) { window.open(workflowUrl(st), "_blank", "noopener"); return; }
  try {
    const status = await getJSON(`data/${st.id}/status.json`, null);
    await gh(`/repos/${S.cfg.repo}/actions/workflows/${st.workflow}/dispatches`, "POST", { ref: "main", ...(inputs ? { inputs } : {}) });
    store.set("working", { id: st.id, since: Date.now(), prev: status?.time || "" });
    toast(`${st.name}에게 일을 시켰어요. 3~5분 뒤 자동으로 새로고침됩니다.`);
    watchWork();
  } catch (e) { toast(`실행 실패: ${e.message}`, 7000); }
}

// 일 시킨 뒤 보고서가 올라올 때까지 20초마다 확인
let watchTimer = null;
function watchWork() {
  clearTimeout(watchTimer);
  const w = store.get("working", null);
  const box = document.getElementById("working");
  if (!w || Date.now() - w.since > 12 * 60e3) { store.del("working"); box?.remove(); return; }
  const st = S.cfg.staff.find((s) => s.id === w.id);
  const mins = Math.floor((Date.now() - w.since) / 60e3);
  const html = `⏳ ${esc(st?.name)} 근무 중… (${mins}분 경과, 보고서가 올라오면 자동으로 새로고침)`;
  if (box) box.innerHTML = html;
  else app.insertAdjacentHTML("afterbegin", `<div class="working" id="working">${html}</div>`);
  watchTimer = setTimeout(async () => {
    delete S.cache[`data/${w.id}/status.json`];
    const status = await getJSON(`data/${w.id}/status.json`, null);
    if (status && status.time !== w.prev && new Date(status.time) > new Date(w.since - 60e3)) {
      store.del("working");
      toast(`${st?.name} 보고서 도착: ${status.message}`, 6000);
      route();
    } else watchWork();
  }, 20000);
}

function settingsModal() {
  const has = !!token();
  const el = document.createElement("div");
  el.className = "modal";
  el.innerHTML = `<div class="sheet">
    <h3>⚙️ GitHub 연결 (한 번만)</h3>
    <p class="muted" style="margin:0">연결하면 이 화면에서 바로 <b>지금 일 시키기 · 더 찾아줘 · 스카우터에 담기</b>를 할 수 있어요. 토큰은 <b>이 기기 브라우저에만</b> 저장됩니다.</p>
    <ol>
      <li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">토큰 만들기 페이지</a>를 엽니다 (GitHub 로그인)</li>
      <li>Token name: <code>shorts-studio</code>, Expiration: 원하는 기간 (예: 1년)</li>
      <li>Repository access: <b>Only select repositories</b> → <code>${esc(S.cfg.repo.split("/")[1])}</code></li>
      <li>Permissions(Repository)에서 <b>Actions: Read and write</b>, <b>Contents: Read and write</b></li>
      <li><b>Generate token</b> → 나온 토큰(<code>github_pat_…</code>)을 아래에 붙여넣기</li>
    </ol>
    <label class="field">토큰<input id="tok" type="password" placeholder="${has ? "저장됨 (바꾸려면 새로 입력)" : "github_pat_..."}" autocomplete="off"></label>
    <div class="actions">
      <button class="btn primary" id="tokSave">저장</button>
      ${has ? `<button class="btn" id="tokDel">연결 해제</button>` : ""}
      <button class="btn" id="tokClose">닫기</button>
    </div>
    <p class="muted" style="margin:0">⚠️ 이 토큰이 있으면 저장소를 수정할 수 있으니, 공용 PC에서는 저장하지 마세요.</p>
  </div>`;
  document.body.appendChild(el);
  const close = () => el.remove();
  el.onclick = (e) => { if (e.target === el) close(); };
  el.querySelector("#tokClose").onclick = close;
  el.querySelector("#tokDel")?.addEventListener("click", () => { store.del("gh-token"); toast("연결을 해제했어요"); close(); route(); });
  el.querySelector("#tokSave").onclick = async () => {
    const v = el.querySelector("#tok").value.trim();
    if (!v) return close();
    store.set("gh-token", v);
    try {
      await gh(`/repos/${S.cfg.repo}`);
      toast("GitHub 연결 완료!");
      close(); route();
    } catch (e) { store.del("gh-token"); toast(`토큰 확인 실패: ${e.message}`, 7000); }
  };
}

// ---------------- 대시보드 ----------------
async function dashboard() {
  const cfg = S.cfg;
  const info = await Promise.all(cfg.staff.map(async (st) => ({
    st, status: await getJSON(`data/${st.id}/status.json`, null), index: await getJSON(`data/${st.id}/index.json`, []),
  })));
  const today = kstDay(Date.now());
  const working = info.filter((x) => x.status && x.status.ok).length;
  const hunter = info.find((x) => x.st.id === "video-hunter");
  const scout = info.find((x) => x.st.id === "product-scout");
  const latest = info.map((x) => x.status?.time).filter(Boolean).sort().pop();

  app.innerHTML = `
    <header><h1>${esc(cfg.studio)}<small>직원 관리</small></h1>
      <div class="actions"><span class="muted">${latest ? `마지막 보고 ${esc(kst(latest))} (${ago(latest)})` : "아직 보고가 없습니다"}</span>
        <button class="btn" data-settings>${token() ? "✅ GitHub 연결됨" : "⚙️ GitHub 연결"}</button></div></header>
    <div class="kpis">
      <div class="kpi"><b>${working} / ${cfg.staff.length}명</b><span>정상 근무 중</span></div>
      <div class="kpi"><b>${hunter?.index.filter((e) => kstDay(e.time) === today).length ?? 0}회</b><span>오늘 헌터 근무</span></div>
      <div class="kpi"><b>${hunter?.index[0]?.count ?? 0}개</b><span>최신 영상 보고</span></div>
      <div class="kpi"><b>${scout?.index[0]?.count ?? 0}개 <small class="muted">(새 ${scout?.index[0]?.new ?? 0})</small></b><span>최신 제품 추천</span></div>
    </div>
    <h2>직원</h2>
    <div class="staff-grid">
      ${info.map(({ st, status, index }) => {

async function hunterPage(st) {
  const { html, index } = await staffHeader(st);
  app.innerHTML = html + `
    <div class="tabs"><button class="tab on" data-v="run">회차별 보고</button><button class="tab" data-v="trend">반복 등장 (누적)</button></div>
    <div class="controls">
      ${runSelect(index)}
      <select id="range" hidden><option value="10">최근 10회 (약 하루)</option><option value="30">최근 30회 (약 3일)</option><option value="70">최근 70회 (약 1주)</option></select>
      <select id="sort"></select>
      <select id="cat"><option value="">전체 분야</option><option value="쇼츠">쇼츠</option><option value="실사용 리뷰">실사용 리뷰</option></select>
      <select id="reg"><option value="">전체 지역</option><option value="US">🇺🇸 미국·서양</option><option value="JP">🇯🇵 일본</option></select>
      <input type="search" id="q" placeholder="제목·채널·제품 검색">
    </div>
    <div class="muted" id="summary"></div><br>
    <div class="grid" id="grid"></div>`;
  if (!index.length) { document.getElementById("grid").innerHTML = `<div class="empty">아직 보고서가 없습니다.</div>`; return; }

  const SORTS = {
    run: [["score", "종합순 (아웃라이어 중심)"], ["outlier", "아웃라이어순"], ["story", "스토리텔링순"], ["style", "스타일 일치순"], ["views_per_hour", "시간당 조회순"], ["views", "조회수순"]],
    trend: [["appear", "반복 등장순"], ["outlier", "아웃라이어순"], ["gain", "증가 조회순"], ["story", "스토리텔링순"], ["views", "조회수순"]],
  };
  let view = "run", rows = [], meta = "";
  const $ = (id) => document.getElementById(id);
  const setSorts = () => { $("sort").innerHTML = SORTS[view].map(([v, l]) => `<option value="${v}">${l}</option>`).join(""); };

  async function load() {
    if (view === "run") {
      const run = await getJSON(`data/${st.id}/${$("run").value}`, { videos: [] });
      rows = run.videos;
      meta = `${kst(run.time)} 보고 · ${rows.length}개` + (run.excluded ? ` · 걸러냄: ${Object.entries(run.excluded).filter(([k]) => k !== "수집").map(([k, v]) => `${k} ${v}`).join(", ")} (수집 ${run.excluded["수집"]})` : "");
    } else {
      const files = index.slice(0, Number($("range").value));
      const runs = (await Promise.all(files.map((e) => getJSON(`data/${st.id}/${e.file}`, null)))).filter(Boolean);
      const map = new Map();
      for (const run of [...runs].reverse()) for (const v of run.videos) {
        const a = map.get(v.video_id);
        if (!a) map.set(v.video_id, { ...v, appear: 1, first_views: v.views });
        else Object.assign(a, v, { appear: a.appear + 1, first_views: a.first_views });
      }
      rows = [...map.values()].map((a) => ({ ...a, gain: Math.max(0, a.views - a.first_views) }));
      meta = `최근 ${runs.length}회 근무 합산 · 고유 영상 ${rows.length}개`;
    }
    render();
  }

  function render() {
    const sort = $("sort").value, q = $("q").value.trim().toLowerCase(), cat = $("cat").value, reg = $("reg").value;
    let list = rows.filter((r) => (!q || `${r.title} ${r.channel} ${r.product_en} ${r.product_ko}`.toLowerCase().includes(q))
      && (!cat || (r.category || "쇼츠") === cat) && (!reg || (r.region || "US") === reg));
    list = [...list].sort((a, b) => (b[sort] ?? 0) - (a[sort] ?? 0));
    $("summary").textContent = meta + (list.length !== rows.length ? ` · 필터 결과 ${list.length}개` : "");
    const trend = view === "trend";
    $("grid").innerHTML = list.length ? list.map((r, i) => {
      const stats = trend ? [["rep", r.appear + "회", "반복 등장"], ["hot", "+" + fmt(r.gain), "증가 조회"], ["", fmt(r.views), "현재 조회"], ["", "x" + r.outlier, "아웃라이어"]]
        : [["hot", "x" + r.outlier, "아웃라이어"], ["", fmt(r.views_per_hour), "시간당 조회"], [r.story >= 7 ? "buy" : "", r.story != null ? r.story + "/10" : "-", "스토리"],
           ["", fmt(r.views), "조회수"], ["", fmt(r.subs), "구독자"], ["", r.like_rate + "%", "좋아요율"]];
      const url = (r.category || "쇼츠") === "쇼츠" ? shortUrl(r.video_id) : `https://www.youtube.com/watch?v=${encodeURIComponent(r.video_id)}`;
      const flag = (r.region || "US") === "JP" ? "🇯🇵" : "🇺🇸";
      const len = r.seconds >= 120 ? `${Math.round(r.seconds / 60)}분` : `${r.seconds}초`;
      return `<article class="card">
        <a class="thumb" href="${url}" target="_blank" rel="noopener">
          <img loading="lazy" src="${thumb(r.video_id)}" alt="" onerror="this.style.visibility='hidden'">
          <span class="badge tl">#${i + 1}</span><span class="badge tr">${trend ? r.appear + "회" : r.score}</span>
          <span class="badge bl">${flag} ${esc(r.field || "미국 쇼츠")}</span><span class="badge br">${len}</span></a>
        <div class="body">
          <div class="title"><a href="${url}" target="_blank" rel="noopener">${esc(r.title)}</a></div>
          <div class="sub">${esc(r.channel)}${r.country ? ` · ${esc(r.country)}` : ""} · ${ago(r.published.replace(" ", "T") + "Z")} 업로드</div>
          ${r.summary_ko ? `<div class="note"><b>내용</b>${esc(r.summary_ko)}</div>` : ""}
          ${r.fun_ko ? `<div class="note"><b>포인트</b>${esc(r.fun_ko)}</div>` : ""}
          ${r.story_ko ? `<div class="note"><b>📖 스토리</b>${esc(r.story_ko)}</div>` : ""}
          <div class="stats">${stats.map(([c, b, s]) => `<div class="stat ${c}"><b>${esc(b)}</b><small>${s}</small></div>`).join("")}</div>
          <div class="chips">${r.product_ko || r.product_en ? `<span class="prod">${esc(r.product_ko || r.product_en)}</span>` : ""}${r.keywords.split(", ").map((k) => `<span>${esc(k)}</span>`).join("")}</div>
        </div></article>`;
    }).join("") : `<div class="empty">조건에 맞는 영상이 없습니다.</div>`;
  }

  setSorts();
  document.querySelectorAll(".tab").forEach((t) => t.onclick = () => {
    document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === t));
    view = t.dataset.v; $("run").hidden = view !== "run"; $("range").hidden = view !== "trend"; setSorts(); load();
  });
  $("run").onchange = load; $("range").onchange = load; $("sort").onchange = render; $("cat").onchange = render; $("reg").onchange = render; $("q").oninput = render;
  load();
}

const SITE_KO = { amazon: "아마존", temu: "테무" };

function bookmarklet() {
  const home = location.origin + location.pathname;
  const code = `(()=>{const q=s=>document.querySelector(s),m=n=>(q('meta[property="'+n+'"]')||{}).content,h=location.hostname,s=/temu/.test(h)?'temu':/amazon/.test(h)?'amazon':'';if(!s){alert('아마존이나 테무 상품 페이지에서 눌러주세요');return}let u=location.href.split('#')[0];const a=u.match(/\\/(?:dp|gp\\/product)\\/([A-Z0-9]{10})/);u=a?location.origin+'/dp/'+a[1]:u.split('?')[0];const d={site:s,url:u,title:((q('#productTitle')||{}).innerText||m('og:title')||document.title).trim().slice(0,200),image:(q('#landingImage')||{}).src||m('og:image')||'',price:((q('.a-price .a-offscreen')||{}).innerText||'').trim(),has_video:!!q('video')};window.open('${home}#capture='+encodeURIComponent(JSON.stringify(d)))})()`;
  return "javascript:" + encodeURIComponent(code);
}

async function sendCapture(item) {
  if (!token()) { store.set("pending-capture", item); settingsModal(); toast("먼저 GitHub 연결을 해주세요. 연결 후 다시 '담기'를 누르면 됩니다.", 6000); return false; }
  const name = `${new Date().toISOString().replace(/[:.]/g, "-")}-${Math.random().toString(36).slice(2, 7)}.json`;
  await gh(`/repos/${S.cfg.repo}/contents/docs/data/product-scout/inbox/${name}`, "PUT",
    { message: `스카우터에 담기: ${(item.title || item.url).slice(0, 50)}`, content: b64(JSON.stringify(item)) });
  store.del("pending-capture");
  const st = S.cfg.staff.find((s) => s.id === "product-scout");
  await runStaff(st, { mode: "capture", site: "both" });
  return true;
}

function captureForm(pre = {}) {
  const el = document.createElement("div");
  el.className = "modal";
  el.innerHTML = `<div class="sheet">
    <h3>➕ 스카우터에 담기</h3>
    ${pre.image ? `<div class="pthumb contain" style="max-height:200px"><img src="${safeUrl(pre.image)}" alt="" onerror="this.parentNode.remove()"></div>` : ""}
    <label class="field">상품 페이지 주소 (아마존·테무)<input id="cUrl" value="${esc(pre.url || "")}" placeholder="https://www.temu.com/... 또는 https://www.amazon.com/..."></label>

    <div class="actions"><button class="btn primary" id="cSend">담기</button><button class="btn" id="cClose">닫기</button></div>
    <p class="muted" style="margin:0">담으면 스카우터가 2~4분 안에 호기심 점수·쇼츠 제목·촬영 아이디어를 붙여서 보고합니다.</p>
  </div>`;
  document.body.appendChild(el);
  const close = () => { el.remove(); if (location.hash.startsWith("#capture")) location.hash = "#product-scout"; };
  el.onclick = (e) => { if (e.target === el) close(); };
  el.querySelector("#cClose").onclick = close;
  el.querySelector("#cSend").onclick = async (ev) => {
    const url = el.querySelector("#cUrl").value.trim();
    if (!/^https:\/\/([\w-]+\.)*(amazon\.[a-z.]+|temu\.com|amzn\.(to|asia|eu)|a\.co)\//i.test(url)) { toast("아마존이나 테무 상품 주소를 넣어주세요"); return; }
    const item = { ...pre, url, site: /temu/i.test(url) ? "temu" : "amazon", title: el.querySelector("#cTitle").value.trim(),
      price: el.querySelector("#cPrice").value.trim(), memo: el.querySelector("#cMemo").value.trim() };
    ev.target.disabled = true; ev.target.textContent = "담는 중…";
    try {
      if (await sendCapture(item)) toast("담았어요! 평가가 끝나면 스카우터 보고서에 '내가 담음'으로 나옵니다.", 6000);
      el.remove(); // 연결 전이면 연결 후 이 내용으로 다시 열림
      return;
    } catch (e) { toast(`담기 실패: ${e.message}`, 7000); }
    ev.target.disabled = false; ev.target.textContent = "담기";
  };
}

        ${p.hook_ko ? `<div>🎬 <b>${esc(p.hook_ko)}</b></div>` : ""}
        ${p.test_ko ? `<div>📷 ${esc(p.test_ko)}</div>` : ""}
        ${p.reaction_ko ? `<div>😲 ${esc(p.reaction_ko)}</div>` : ""}
        ${p.story_ko ? `<div>📖 <b>스토리</b> ${esc(p.story_ko)}</div>` : ""}</div>` : ""}
      ${p.caution_ko ? `<div class="note"><b>⚠️ 주의</b>${esc(p.caution_ko)}</div>` : ""}
      ${!p.evaluated ? `<div class="sub">AI 평가 대기 중 — 다음 근무 때 평가됩니다</div>` : ""}
      <div class="shop">
        ${p.source === "capture" ? `<a class="main" href="${safeUrl(p.url)}" target="_blank" rel="noopener">${SITE_KO[p.site]} 상품 페이지</a>`
          : `<a class="main" href="${safeUrl(searchUrl)}" target="_blank" rel="noopener">${SITE_KO[p.site]}에서 찾기</a>`}
        <a href="${safeUrl(p.links.coupang)}" target="_blank" rel="noopener">쿠팡</a>
        <a href="${safeUrl(p.links.aliexpress)}" target="_blank" rel="noopener">알리</a>
        <button data-fav="${esc(p.id)}" class="${favs.has(p.id) ? "on" : ""}">${favs.has(p.id) ? "⭐ 찜함" : "☆ 찜"}</button>
      </div>
    </article>`;
  }

  function render() {
    const counts = { amazon: 0, temu: 0 };
    for (const p of pool) if (showAll || sessionNew.has(p.id)) counts[p.site] = (counts[p.site] || 0) + 1;
    $("siteTabs").innerHTML = ["amazon", "temu"].map((s) => `<button class="tab ${s === site ? "on" : ""}" data-site="${s}">${SITE_KO[s]} <small class="muted">${counts[s] || 0}</small></button>`).join("");
    $("findBtn").textContent = `🔎 ${SITE_KO[site]}에서 더 찾아줘`;
    const l = list();
    const page = l.slice(0, shown);
    page.forEach((p) => seen.add(p.id));
    store.set("scout-seen", [...seen].slice(-3000));
    $("summary").textContent = `${SITE_KO[site]} · ${showAll ? "전체" : "새로 보는"} 제품 ${l.length}개 중 ${page.length}개 표시 · 전체 보관 ${pool.length}개`;
    $("grid").innerHTML = page.length ? page.map(card).join("") : `<div class="empty">${showAll ? "제품이 없습니다." : "새 제품을 다 봤어요 👍<br>위의 <b>더 찾아줘</b>를 누르면 스카우터가 추가로 찾아옵니다. (1회 약 2~4분)"}</div>`;
    $("moreBox").innerHTML = l.length > shown ? `<button class="btn" id="moreBtn">더 보기 (${Math.min(10, l.length - shown)}개 더)</button>` : "";
    $("moreBtn")?.addEventListener("click", () => { shown += 10; render(); });
  }

  $("siteTabs").onclick = (e) => { const b = e.target.closest("[data-site]"); if (b) { site = b.dataset.site; store.set("scout-tab", site); shown = 10; render(); } };
  $("src").onchange = () => { shown = 10; render(); };
  $("sort").onchange = render;
  $("all").onchange = (e) => { showAll = e.target.checked; shown = 10; render(); };
  $("grid").onclick = (e) => {
    const b = e.target.closest("[data-fav]"); if (!b) return;
    favs.has(b.dataset.fav) ? favs.delete(b.dataset.fav) : favs.add(b.dataset.fav);
    store.set("scout-favs", [...favs]); render();
  };
  $("addBtn").onclick = () => captureForm();
  $("findBtn").onclick = () => runStaff(st, { mode: "more", site });
  render();
}

async function route() {
  S.cache = {};
  if (!S.cfg) S.cfg = await getJSON("data/staff.json", null);
  if (!S.cfg) { app.innerHTML = `<div class="empty">설정 파일(data/staff.json)을 불러오지 못했습니다.</div>`; return; }
  const hash = location.hash.slice(1);
  if (hash.startsWith("capture=")) {  // 북마크 버튼으로 넘어온 상품
    let item = {};
    try { item = JSON.parse(decodeURIComponent(hash.slice(8))); } catch {}
    history.replaceState(null, "", "#product-scout");
    await route();
    captureForm(item);
    return;
  }
  const st = S.cfg.staff.find((s) => s.id === hash);
  window.scrollTo(0, 0);
  if (!st) await dashboard();
  else if (st.report === "videos") await hunterPage(st);
  else if (st.report === "products") await scoutPage(st);
  const pending = store.get("pending-capture", null);
  if (pending && token()) captureForm(pending);
  if (store.get("working", null)) watchWork();
}
document.addEventListener("click", (e) => {
  const run = e.target.closest("[data-run]");
  if (run) { const st = S.cfg.staff.find((s) => s.id === run.dataset.run); if (st) runStaff(st, st.id === "product-scout" ? { mode: "auto", site: "both" } : undefined); }
  if (e.target.closest("[data-settings]")) settingsModal();
});
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
