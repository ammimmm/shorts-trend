name: "직원1 헌터 - 해외 영상 소스"

on:
  schedule:
    # 하루 10회 (UTC). 1회 약 870 할당량 → 하루 무료 한도 10,000 이내
    - cron: "17 0,2,5,7,10,12,15,17,20,22 * * *"
  workflow_dispatch: # Actions 탭의 "Run workflow" 버튼으로 바로 일 시키기

permissions:
  contents: write
  models: read # 무료 AI (GitHub Models)

concurrency:
  group: staff-data # 직원들이 동시에 보고서를 올리다 충돌하지 않게 순서대로
  cancel-in-progress: false

jobs:
  work:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: 근무
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python staff/video_hunter.py

      - name: 보고서 제출
        if: always() # 실패해도 '오류' 상태를 대시보드에 남김
        run: bash staff/commit_report.sh "헌터 근무"
