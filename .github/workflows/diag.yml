name: "임시 점검 - 무료 AI"
on:
  push:
    paths: ["diag/ai_check.py", ".github/workflows/diag.yml"]
permissions:
  contents: write
  models: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests && python diag/ai_check.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 공식 액션으로도 확인
        id: ai
        continue-on-error: true
        uses: actions/ai-inference@v1
        with:
          prompt: 'Reply with JSON {"ok": true}'
          model: openai/gpt-4.1-mini
      - if: always()
        run: |
          echo '${{ steps.ai.outputs.response }}' > diag/action_result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag && git commit -q -m "AI 점검 결과" && git pull -q --rebase origin main && git push -q || true
