name: 쇼츠 트렌드 수집

on:
  schedule:
    # 하루 10회 (UTC 기준, 한국시간 = UTC+9). 1회 약 850유닛 → 하루 무료 한도 10,000 이내
    - cron: "17 0,2,5,7,10,12,15,17,20,22 * * *"
  workflow_dispatch: # Actions 탭에서 "Run workflow" 버튼으로 바로 실행

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: 수집 실행
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        # 국가/단어 제외는 필요에 맞게 수정 (인도 쇼핑몰 영상이 상위를 많이 차지해서 기본 제외)
        run: python trend_finder.py --json-dir docs/data --exclude-countries IN,PK,BD --exclude-words meesho,flipkart,hindi

      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "트렌드 수집 $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase
          git push
